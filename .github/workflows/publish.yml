name: Publish to npm

# Publishes the package.json version when a vX.Y.Z tag is pushed (e.g. v0.2.0).
# n8n only verifies nodes published from GitHub Actions with provenance; running
# "npm publish" from a local machine does not count for the verified badge.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # provenance signature through GitHub OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Tag matches the package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $v."
            exit 1
          fi

      - run: npm run build
      - run: npm run lint
      - run: npm run lint:dist

      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
